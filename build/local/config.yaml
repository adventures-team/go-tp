queueds:
  # адреса шардов в compose-сети dev-env (тесты выполняются в сервисе tests, см. test/const_test.go)
  multi: queued_shard0:20000,queued_shard1:20000
tp:
  go:
    log_level: debug
    workers: 5
    queue_ids: 1122,1123
    initial_delay: 5s
    # пер-пакетные уровни логгирования (advslog.WithLevelConfig, см. tp.WithLogLevelConfig).
    # Ключи "": [...] - это child lists ("<path>/" со списком детей): без них advslog
    # не найдёт оверрайды и не подпишется на изменения поддерева.
    # NB: ключа log/level нет намеренно: глобальным уровнем владеет параметр log_level (applyConfig),
    # а это поддерево задаёт только пер-пакетные оверрайды - при наличии log/level за глобальный
    # уровень конкурировали бы два писателя.
    log:
      "": ["github.com"]
      github.com:
        "": ["adventures-team"]
        adventures-team:
          "": ["go-tp"]
          go-tp:
            "": ["test"]
            test:
              "": ["level"]
              level: error
# queued-mover (cmd/queued-mover): кластер A - queued_shard0/1, кластер B - queued_dst0/1
# (см. dev-env/docker-compose.yaml). Поддерево - основа конфигов test/mover_integration_test.go
# (тесты переопределяют отдельные параметры). Очередь 65526 - см. test/const_test.go.
queued-mover:
  src:
    queueds:
      multi: queued_shard0:20000,queued_shard1:20000
  dst:
    queueds:
      multi: queued_dst0:20000,queued_dst1:20000
  queue_ids: 65526
  one_shot: 1
  fetch_batch_size: 5
  poll_delay: 0.1
  defer_time: 2
  stat_period: 2
  log_level: debug
