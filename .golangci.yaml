version: "2"
run:
  issues-exit-code: 1
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - dupl
    - errcheck
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - prealloc
    - revive
    - staticcheck
    - unused
    - wastedassign
    - wsl_v5
  settings:
    dupl:
      threshold: 100
    goconst:
      min-len: 2
      min-occurrences: 2
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - gocognit
          - gocyclo
          - gosec
          - prealloc
          - wsl_v5
        path: .*\.*_test\.go$
      - linters: ["staticcheck"]
        text: QF1008
      - linters: ["gosec"]
        text: G104
      - linters: ["gosec"]
        text: G115
      - linters: ["revive"]
        text: 'exported: .* should have comment .*'
      - linters: ["revive"]
        text: 'should have a package comment'
formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
