version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - prealloc
    - revive
    - staticcheck
    - unused
    - wastedassign
    - wsl
  settings:
    dupl:
      threshold: 100
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      enabled-checks:
        - nilValReturn
    revive:
      rules:
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - revive
        path: design/
        text: 'dot-imports:'
      - linters:
          - dupl
          - gocognit
          - gocyclo
          - gosec
          - prealloc
          - wsl
        path: .*\.*_test\.go$
      - linters:
          - staticcheck
        text: QF1008
      - path: (.+)\.go$
        text: G104
      - path: (.+)\.go$
        text: G115
      - path: (.+)\.go$
        text: Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*printf?|.*println|os\.(Un)?Setenv|.*Rollback). is not checked
      - path: (.+)\.go$
        text: _struct` is unused
      - path: (.+)\.go$
        text: not declared by package utf8
      - path: (.+)\.go$
        text: unicode/utf8/utf8.go
      - path: (.+)\.go$
        text: 'exported: .* should have comment .*'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
